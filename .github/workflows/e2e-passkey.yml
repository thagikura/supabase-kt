name: Passkey E2E Tests

on:
  push:
    branches: [master]
    paths:
      - 'Auth/src/**/passkey/**'
      - 'integration-test/e2e/**'
  pull_request:
    branches: [master]
    paths:
      - 'Auth/src/**/passkey/**'
      - 'integration-test/e2e/**'

jobs:
  e2e-passkey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start --workdir integration-test

      - name: Enable passkeys on auth container
        run: |
          docker inspect supabase_auth_supabase-kt-tests -f '{{range .Config.Env}}{{println .}}{{end}}' > /tmp/gotrue_env.txt
          AUTH_IMAGE=$(docker inspect supabase_auth_supabase-kt-tests --format '{{.Config.Image}}')
          docker stop supabase_auth_supabase-kt-tests
          docker rm supabase_auth_supabase-kt-tests
          docker run -d --name supabase_auth_supabase-kt-tests \
            --network supabase_network_supabase-kt-tests \
            --env-file /tmp/gotrue_env.txt \
            -e GOTRUE_PASSKEY_ENABLED=true \
            -e GOTRUE_WEBAUTHN_RP_ID=localhost \
            -e GOTRUE_WEBAUTHN_RP_ORIGINS=http://localhost:8080 \
            -e GOTRUE_WEBAUTHN_RP_DISPLAY_NAME=supabase-kt-tests \
            $AUTH_IMAGE gotrue
          sleep 3

      - name: Export Supabase env vars
        run: |
          echo "SUPABASE_URL=$(supabase status --workdir integration-test --output json | jq -r '.API_URL')" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$(supabase status --workdir integration-test --output json | jq -r '.ANON_KEY')" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: integration-test/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: integration-test/e2e
        run: npx playwright install chromium --with-deps

      - name: Run Passkey E2E tests
        working-directory: integration-test/e2e
        run: npx playwright test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: integration-test/e2e/test-results/

      - name: Stop Supabase
        if: always()
        run: supabase stop --workdir integration-test
